[run]
seed = 20261019

[machines]
"Darwin-arm64" = "M-A"
"Linux-x86_64" = "M-B"

[perf]
subjects = ["cf", "zlib", "zng", "zrs", "mox", "zsys"]
native_subjects = ["cf", "zrs", "mox"]
corpora = ["silesia", "canterbury"]
files = []
levels = [1, 6, 9]
framings = ["raw", "zlib", "gzip"]
modes = ["oneshot", "stream_small", "stream_large"]
small_in_chunk = 1024
small_out_chunk = 4096
large_in_chunk = 1048576
large_out_chunk = 1048576
warmup_ms = 500
min_samples = 30
min_sample_ms = 10
runs = 2
bootstrap_resamples = 2000
ci_level = 0.95
agreement_tolerance = 0.05
max_start_load = 1.0

[perf.tiny]
sources = ["canterbury/alice29.txt", "canterbury/kennedy.xls", "silesia/xml"]
prefix_bytes = [64, 256, 1024]

[profiles.quick.perf]
files = ["canterbury/alice29.txt", "canterbury/kennedy.xls"]
levels = [6]
warmup_ms = 20
min_samples = 5
min_sample_ms = 2

[profiles.quick.perf.tiny]
prefix_bytes = [256]

[framing]
checksum_subjects = ["cf", "zlib", "zlib-nohw", "zng", "zrs", "mox", "zsys"]
checksum_sizes = [64, 4096, 65536, 1048576]
subjects = ["cf", "zlib", "zlib-nohw", "zng", "zrs", "mox", "zsys"]
modes = ["oneshot"]
hypothesis_tolerance = 0.25
figure_corpus = "silesia"
figure_level = 6

[profiles.quick.framing]
figure_level = 6

[paper]
parity_ratio = 0.95
machines = ["M-A", "M-B"]
perf_corpus = "silesia"
perf_framings = ["raw", "zlib"]
perf_levels = [6, 9]
perf_mode = "oneshot"
perf_variant = "generic"
trajectory_level = 6
trajectory_framing = "raw"
trajectory_mode = "oneshot"
figure = "throughput_unsafe"
figure_corpus = "silesia"
figure_framing = "raw"
figure_level = 6
figure_mode = "oneshot"
figure_subjects = ["cf", "mox", "zlib"]
table_opt = "3"
table_machine = "M-B"

[conformance]
subjects = ["cf", "zlib", "zng", "zrs", "mox", "zsys"]

[trajectory]
subjects = ["cf-r1", "cf-r2", "cf-r3", "zlib"]
modes = ["oneshot", "stream_small"]
levels = [1, 6, 9]
runs = 1

[profiles.quick.trajectory]
levels = [6]

[effort]
# Gaps between consecutive commits longer than this are treated as idle time, not stage work.
idle_gap_hours = 3
transcripts_dir = "~/.claude/projects/-media-ericmann-Data-Projects-cleanflate"
# Defect source keywords (matched case-insensitively in `Defects-caught:` trailers); a stage of
# `review` or `fix` breaks ties in favour of review and is the default source when nothing matches.
defect_keywords = { fuzzing = ["fuzz"], conformance = ["conformance", "oracle", "corpus", "compare"], unit_tests = ["test", "mutant", "mutation"], review = ["review"] }
# Denial reason prefixes, first match wins (documented in docs/methods/effort.md).
denial_categories = [
    { prefix = "forbidden word", category = "clean-room forbidden word" },
    { prefix = "recursive grep", category = "recursive grep" },
    { prefix = "fetch script denied", category = "network lockdown" },
    { prefix = "curl", category = "network lockdown" },
    { prefix = "unparseable command", category = "unparseable command" },
    { prefix = "SPEC phase", category = "profiling rule" },
    { prefix = "gh is forbidden", category = "forbidden tool" },
    { prefix = "git clone is forbidden", category = "forbidden tool" },
]

[charts]
base_dpi = 100
paper_width_in = 3.3
slide_width_in = 13.333
slide_height_in = 7.5
paper_height_in = 2.6
default_width_in = 6.4
default_height_in = 4.0
footnote_pt = 6
font_family = "DejaVu Sans"

[similarity]
ngram_min = 5
ngram_max = 10
min_ident_len = 6
comment_ngram = 5
top_k = 20
near_fraction = 0.25
max_window_occurrences = 50
context_pairs = [{ left = "zlib", right = "zng", role = "context" }]
pairs = [
    { left = "zrs", right = "mox", role = "negative" },
    { left = "zrs", right = "zng", role = "positive" },
    { left = "cf", right = "zrs", role = "test" },
    { left = "cf", right = "mox", role = "test" },
    { left = "cf", right = "zlib", role = "test" },
    { left = "cf", right = "zng", role = "test" },
]

[size]
opt_levels = ["3", "s"]
bloat_top = 30
