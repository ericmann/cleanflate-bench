# Model prices for cost estimates (SPEC 3.9). Deliberately UNSET: the benchmark never guesses a
# price. Fill in the five per-million-token keys of a model (USD) and set `source` to the URL or
# document the number came from and `as_of` to its date; cost is computed only for models with all
# five prices. TOML has no null, so a missing price is a missing key.
#
#   input_per_mtok, output_per_mtok, cache_write_5m_per_mtok, cache_write_1h_per_mtok,
#   cache_read_per_mtok

[models."claude-opus-5-5"]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-01"
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_write_5m_per_mtok = 5.0
cache_write_1h_per_mtok = 8.0
cache_read_per_mtok = 0.2

[models."claude-sonnet-5-5"]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-01"
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_write_5m_per_mtok = 2.5
cache_write_1h_per_mtok = 4.0
cache_read_per_mtok = 0.2

[models."claude-sonnet-5"]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-01"
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_write_5m_per_mtok = 2.5
cache_write_1h_per_mtok = 4.0
cache_read_per_mtok = 0.2
