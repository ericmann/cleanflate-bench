# Hand classification of every tool call that cleanflate's guard denied (provenance tool log), read
# by cfbench.effort.derive (method in docs/methods/effort.md). Keyed by the denial's `ts`.
# verdict = "prior-art attempt": the call sought prior-art source, binaries or docs.
# verdict = "false positive":    the call did not seek prior art; a guard rule matched its text.
# verdict = "offline test":      the call deliberately exercised the network lockdown or an offline build.
# `category`, when set, replaces the reason-prefix category (effort.denial_categories): commands
# that made no network request are "network false positive", not "network lockdown".
# A denial with no entry counts as a prior-art attempt. Retries are merged into attempts by
# effort.denial_retry_seconds in config/bench.toml.
# All entries classified 2026-10-05 from the logged command text.

