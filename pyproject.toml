[project]
name = "cfbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "tree-sitter>=0.26.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-c>=0.24.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfbench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
